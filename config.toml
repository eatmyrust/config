# Global mise config: this repo is ~/.config/mise. It declares the whole machine
# (system packages, git checkouts, dotfiles, login shell, dev tools), so a new
# machine needs only:
#
#   curl https://mise.run | sh
#   ~/.local/bin/mise bootstrap --adopt eatmyrust/config --yes
#
# Re-running `mise bootstrap` converges an existing machine; `mise run upgrade`
# updates everything.
#
# Versions are declared loosely here and pinned exactly in mise.lock, which is
# committed. Use `mise upgrade` to move within a range, `mise upgrade --bump` to
# move the range itself.

[settings]
auto_update = true
# Resolve every "latest"/"lts" into mise.lock with checksums, so a fresh
# machine reproduces this one exactly.
lockfile = true
# Don't let a mistyped command trigger a surprise install.
not_found_auto_install = false
minimum_release_age_excludes = ["claude-code"]

