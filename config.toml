[bootstrap.brew]
adopt = true

[bootstrap.repos]
"~/.oh-my-zsh"    = { url = "https://github.com/ohmyzsh/ohmyzsh.git" }
"~/powerlevel10k" = { url = "https://github.com/romkatv/powerlevel10k.git" }
"~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting" = { url = "https://github.com/zsh-users/zsh-syntax-highlighting.git" }
"~/.oh-my-zsh/custom/plugins/zsh-completions"         = { url = "https://github.com/zsh-users/zsh-completions.git" }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm" }

[bootstrap.hooks]
post-repos = 'GITSTATUS_CACHE_DIR="$HOME/powerlevel10k/gitstatus/usrbin" "$HOME/powerlevel10k/gitstatus/install"'

[dotfiles]
"~" = { source = "home", mode = "symlink-each" }
# Claude Code reads skills only from ~/.claude/skills. Third-party skills get
# linked there by the Skills CLI (setup:skills); custom ones are linked here.
"~/.claude/skills/[!.]*" = "home/.agents/skills/[!.]*"

[bootstrap.user]
login_shell = "/bin/zsh"

[tasks.bootstrap]
description = "Imperative machine setup run at the end of mise bootstrap"
depends = ["setup:*"]

[tasks."setup:tmux"]
description = "Install tmux plugins via TPM"
run = "~/.tmux/plugins/tpm/bin/install_plugins"

[tasks."setup:nvim"]
description = "Install nvim plugins, LSP servers, and treesitter parsers"
run = "nvim --headless +qa"
